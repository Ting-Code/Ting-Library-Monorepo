# 设置运行 Nginx 的用户
user  nginx;

worker_processes  auto;

error_log  /var/log/nginx/error.log warn;

pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen       80;
        server_name 159.75.104.173;

        # 基座菜单路由 /{module}/…（与 html/{module} 静态目录同名）
        # 刷新时必须返回基座 SPA 的 index.html，由 micro-app 再加载 /micro/{module}/ 子应用
        location = /docs {
            return 302 /docs/;
        }
        location ^~ /docs/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files /index.html =404;
        }

        location = /i18n {
            return 302 /i18n/;
        }
        location ^~ /i18n/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files /index.html =404;
        }

        location = /nexus {
            return 302 /nexus/;
        }
        location ^~ /nexus/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files /index.html =404;
        }

        location = /modeling {
            return 302 /modeling/;
        }
        location ^~ /modeling/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files /index.html =404;
        }

        # 子应用构建产物（与 proMicroUrlMap /micro/{module}/ 一致，见 packages/lib/system/src/hooks/micro.ts）
        location = /micro/demo {
            return 302 /micro/demo/;
        }
        location ^~ /micro/demo/ {
            if ($request_filename ~* .*\.(?:htm|html)$) {
               add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate";
            }
            alias /usr/share/nginx/html/demo/;
            index index.html;
            try_files $uri $uri/ index.html =404;
        }

        location = /micro/docs {
            return 302 /micro/docs/;
        }
        location ^~ /micro/docs/ {
            if ($request_filename ~* .*\.(?:htm|html)$) {
               add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate";
            }
            alias /usr/share/nginx/html/docs/;
            index index.html;
            try_files $uri $uri/ index.html =404;
        }

        location = /micro/i18n {
            return 302 /micro/i18n/;
        }
        location ^~ /micro/i18n/ {
            if ($request_filename ~* .*\.(?:htm|html)$) {
               add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate";
            }
            alias /usr/share/nginx/html/i18n/;
            index index.html;
            try_files $uri $uri/ index.html =404;
        }

        location = /micro/modeling {
            return 302 /micro/modeling/;
        }
        location ^~ /micro/modeling/ {
            if ($request_filename ~* .*\.(?:htm|html)$) {
               add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate";
            }
            alias /usr/share/nginx/html/modeling/;
            index index.html;
            try_files $uri $uri/ index.html =404;
        }

        location = /micro/nexus {
            return 302 /micro/nexus/;
        }
        location ^~ /micro/nexus/ {
            if ($request_filename ~* .*\.(?:htm|html)$) {
               add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate";
            }
            alias /usr/share/nginx/html/nexus/;
            index index.html;
            try_files $uri $uri/ index.html =404;
        }

        location / {
            if ($request_filename ~* .*\.(?:htm|html)$) {
               add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate";
            }
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        error_page  404              /404.html;
        location = /404.html {
            root   /usr/share/nginx/html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
