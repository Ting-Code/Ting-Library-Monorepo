name: CI/CD

on:
  push:
    branches: ['master']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 跳过 husky 安装；CI 无本地 Git 钩子需求，避免 prepare 阶段异常
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与 package.json 中 packageManager / engines.pnpm 对齐（pnpm 11 + workspace lockfile）
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      # engines.node 要求 >=20.19；使用当前 LTS 系列避免旧 20.x 边界版本
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: build @apps/admin
        run: pnpm --filter @apps/admin... build

      - name: build @apps/micro-demo
        run: pnpm --filter @apps/micro-demo... build

      - name: build @apps/micro-docs
        run: pnpm --filter @apps/micro-docs... build

      - name: build @apps/micro-modeling
        run: pnpm --filter @apps/micro-modeling... build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push the Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.github/workflows/Dockerfile
          push: true
          tags: tingcode/web-admin:latest

      - name: ssh docker login
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: sh web_admin.sh
