name: CI/CD

on:
  push:
    branches: ['master']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: install pnpm
        run: npm install -g pnpm@11.0.9

      - name: pnpm install
        run: pnpm install

      - name: build @apps/admin
        run: pnpm --filter @apps/admin... build

      - name: build @apps/micro-demo
        run: pnpm --filter @apps/micro-demo... build

      - name: build @apps/micro-docs
        run: pnpm --filter @apps/micro-docs... build

      - name: build @apps/micro-modeling
        run: pnpm --filter @apps/micro-modeling... build

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push the Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.github/workflows/Dockerfile
          push: true
          tags: tingcode/web-admin:latest

      - name: Export image
        run: |
          docker pull tingcode/web-admin:latest
          docker save tingcode/web-admin:latest | gzip -1 > web-admin-image.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: web-admin-image.tar.gz
          target: /tmp
          timeout: 30m
          command_timeout: 30m

      - name: Deploy web-admin container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 30m
          command_timeout: 30m
          script: |
            gunzip -c /tmp/web-admin-image.tar.gz | docker load
            rm -f /tmp/web-admin-image.tar.gz
            docker stop web-admin || true
            docker rm web-admin || true
            docker run -d -p 8680:8680 -p 80:80 --name web-admin --restart unless-stopped tingcode/web-admin:latest
