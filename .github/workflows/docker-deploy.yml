name: CI/CD

on:
  push:
    branches: ['master']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: install pnpm
        run: npm install -g pnpm@11.0.9

      - name: pnpm install
        run: pnpm install

      - name: build @apps/admin
        run: pnpm --filter @apps/admin... build

      - name: build @apps/micro-demo
        run: pnpm --filter @apps/micro-demo... build

      - name: build @apps/micro-docs
        run: pnpm --filter @apps/micro-docs... build

      - name: build @apps/micro-i18n
        run: pnpm --filter @apps/micro-i18n... build

      - name: build @apps/micro-modeling
        run: pnpm --filter @apps/micro-modeling... build

      - name: build @apps/micro-nexus
        env:
          CI: true
          NODE_ENV: production
        run: pnpm --filter @apps/micro-nexus... build

      - name: Package site assets
        run: |
          rm -rf /tmp/web-admin-site
          mkdir -p /tmp/web-admin-site/html/demo /tmp/web-admin-site/html/docs /tmp/web-admin-site/html/modeling /tmp/web-admin-site/html/nexus
          cp -a packages/apps/admin/dist/. /tmp/web-admin-site/html/
          cp -a packages/apps/micro-demo/dist/. /tmp/web-admin-site/html/demo/
          cp -a packages/apps/micro-docs/dist/. /tmp/web-admin-site/html/docs/
          cp -a packages/apps/micro-modeling/dist/. /tmp/web-admin-site/html/modeling/
          cp -a packages/apps/micro-nexus/dist/. /tmp/web-admin-site/html/nexus/
          cp .github/workflows/nginx.conf /tmp/web-admin-site/nginx.conf
          tar -C /tmp -czf web-admin-assets.tar.gz web-admin-site
          ls -lh web-admin-assets.tar.gz

      - name: Copy assets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: web-admin-assets.tar.gz
          target: /tmp
          timeout: 30m
          command_timeout: 30m

      - name: Deploy web-admin container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 30m
          command_timeout: 30m
          script: |
            rm -rf /opt/web-admin-site
            tar -C /opt -xzf /tmp/web-admin-assets.tar.gz
            rm -f /tmp/web-admin-assets.tar.gz
            docker image inspect nginx:alpine >/dev/null 2>&1 || docker pull nginx:alpine
            docker stop web-admin || true
            docker rm web-admin || true
            docker run -d \
              --name web-admin \
              --restart unless-stopped \
              --add-host=host.docker.internal:host-gateway \
              -p 80:80 \
              -v /opt/web-admin-site/html:/usr/share/nginx/html:ro \
              -v /opt/web-admin-site/nginx.conf:/etc/nginx/nginx.conf:ro \
              nginx:alpine
