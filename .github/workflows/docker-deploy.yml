name: CI/CD

on:
  push:
    branches: ['master']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: install pnpm
        run: npm install -g pnpm@11.0.9

      - name: pnpm install
        run: pnpm install

      - name: build @apps/admin
        run: pnpm --filter @apps/admin... build

      - name: build @apps/micro-demo
        run: pnpm --filter @apps/micro-demo... build

      - name: build @apps/micro-docs
        run: pnpm --filter @apps/micro-docs... build

      - name: build @apps/micro-modeling
        run: pnpm --filter @apps/micro-modeling... build

      - name: Prepare site assets
        run: |
          rm -rf /tmp/web-admin-site
          mkdir -p /tmp/web-admin-site/html/demo /tmp/web-admin-site/html/docs /tmp/web-admin-site/html/modeling
          cp -a packages/apps/admin/dist/. /tmp/web-admin-site/html/
          cp -a packages/apps/micro-demo/dist/. /tmp/web-admin-site/html/demo/
          cp -a packages/apps/micro-docs/dist/. /tmp/web-admin-site/html/docs/
          cp -a packages/apps/micro-modeling/dist/. /tmp/web-admin-site/html/modeling/
          cp .github/workflows/nginx.conf /tmp/web-admin-site/nginx.conf

      - name: Install rsync and sshpass
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Sync site assets to server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p /opt/web-admin-site/html"
          sshpass -e rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }}" \
            /tmp/web-admin-site/html/ \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/opt/web-admin-site/html/"
          sshpass -e rsync -az \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }}" \
            /tmp/web-admin-site/nginx.conf \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/opt/web-admin-site/nginx.conf"

      - name: Deploy web-admin container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 30m
          command_timeout: 30m
          script: |
            docker image inspect nginx:alpine >/dev/null 2>&1 || docker pull nginx:alpine
            docker stop web-admin || true
            docker rm web-admin || true
            docker run -d \
              --name web-admin \
              --restart unless-stopped \
              --add-host=host.docker.internal:host-gateway \
              -p 80:80 \
              -v /opt/web-admin-site/html:/usr/share/nginx/html:ro \
              -v /opt/web-admin-site/nginx.conf:/etc/nginx/nginx.conf:ro \
              nginx:alpine
