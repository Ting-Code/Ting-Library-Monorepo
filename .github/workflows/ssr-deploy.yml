name: SSR CI/CD

on:
  push:
    branches: ['master']
    paths:
      - 'packages/apps/ssr/**'
      - 'configs/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ssr-deploy.yml'
      - '.github/workflows/Dockerfile.ssr'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install pnpm
        run: npm install -g pnpm@11.0.9

      - name: pnpm install
        run: pnpm install

      - name: Build @apps/ssr
        env:
          CI: true
          NODE_ENV: production
        run: pnpm --filter @apps/ssr build

      - name: Verify ssr build output
        run: test -f packages/apps/ssr/.next/standalone/packages/apps/ssr/server.js

      - name: Package runtime bundle
        run: |
          rm -rf /tmp/ssr-runtime
          mkdir -p /tmp/ssr-runtime/packages/apps/ssr/.next
          cp -a packages/apps/ssr/.next/standalone/. /tmp/ssr-runtime/
          cp -a packages/apps/ssr/.next/static /tmp/ssr-runtime/packages/apps/ssr/.next/static
          cp -a packages/apps/ssr/public /tmp/ssr-runtime/packages/apps/ssr/public
          find /tmp/ssr-runtime -name '*.map' -delete
          tar -C /tmp -czf ssr-runtime.tar.gz ssr-runtime
          ls -lh ssr-runtime.tar.gz

      - name: Copy runtime to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: ssr-runtime.tar.gz
          target: /tmp
          timeout: 30m
          command_timeout: 30m

      - name: Deploy ssr container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 30m
          command_timeout: 30m
          script: |
            rm -rf /opt/ssr
            mkdir -p /opt/ssr
            tar -C /opt/ssr --strip-components=1 -xzf /tmp/ssr-runtime.tar.gz
            rm -f /tmp/ssr-runtime.tar.gz
            docker image inspect node:22-alpine >/dev/null 2>&1 || docker pull node:22-alpine
            docker stop ssr || true
            docker rm ssr || true
            docker run -d \
              --name ssr \
              --restart unless-stopped \
              -p 8080:8080 \
              -e NODE_ENV=production \
              -e PORT=8080 \
              -e HOSTNAME=0.0.0.0 \
              -v /opt/ssr:/app:ro \
              -w /app \
              node:22-alpine \
              node packages/apps/ssr/server.js
