name: Micro Nexus CI/CD

on:
  push:
    branches: ['master']
    paths:
      - 'packages/apps/micro-nexus/**'
      - 'configs/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/micro-nexus-deploy.yml'
      - '.github/workflows/Dockerfile.micro-nexus'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install pnpm
        run: npm install -g pnpm@11.0.9

      - name: pnpm install
        run: pnpm install

      - name: Build @apps/micro-nexus
        env:
          CI: true
          NODE_ENV: production
        run: pnpm --filter @apps/micro-nexus build

      - name: Verify micro-nexus build output
        run: test -f packages/apps/micro-nexus/.next/standalone/packages/apps/micro-nexus/server.js

      - name: Prepare runtime bundle
        run: |
          rm -rf /tmp/micro-nexus-runtime
          mkdir -p /tmp/micro-nexus-runtime/packages/apps/micro-nexus/.next
          cp -a packages/apps/micro-nexus/.next/standalone/. /tmp/micro-nexus-runtime/
          cp -a packages/apps/micro-nexus/.next/static /tmp/micro-nexus-runtime/packages/apps/micro-nexus/.next/static
          cp -a packages/apps/micro-nexus/public /tmp/micro-nexus-runtime/packages/apps/micro-nexus/public
          find /tmp/micro-nexus-runtime -name '*.map' -delete
          du -sh /tmp/micro-nexus-runtime

      - name: Install rsync and sshpass
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Sync runtime to server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p /opt/micro-nexus"
          sshpass -e rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }}" \
            /tmp/micro-nexus-runtime/ \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/opt/micro-nexus/"

      - name: Deploy micro-nexus container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 30m
          command_timeout: 30m
          script: |
            docker image inspect node:22-alpine >/dev/null 2>&1 || docker pull node:22-alpine
            docker stop micro-nexus || true
            docker rm micro-nexus || true
            docker run -d \
              --name micro-nexus \
              --restart unless-stopped \
              -p 8086:8086 \
              -e NODE_ENV=production \
              -e PORT=8086 \
              -e HOSTNAME=0.0.0.0 \
              -v /opt/micro-nexus:/app:ro \
              -w /app \
              node:22-alpine \
              node packages/apps/micro-nexus/server.js
