name: Micro Nexus CI/CD

on:
  push:
    branches: ['master']
    paths:
      - 'packages/apps/micro-nexus/**'
      - 'configs/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/micro-nexus-deploy.yml'
      - '.github/workflows/Dockerfile.micro-nexus'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install pnpm
        run: npm install -g pnpm@11.0.9

      - name: pnpm install
        run: pnpm install

      - name: Build @apps/micro-nexus
        env:
          CI: true
        run: pnpm --filter @apps/micro-nexus build

      - name: Verify micro-nexus build output
        run: test -f packages/apps/micro-nexus/.next/standalone/packages/apps/micro-nexus/server.js

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push the Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.github/workflows/Dockerfile.micro-nexus
          push: true
          tags: tingcode/micro-nexus:latest

      - name: Export image
        run: |
          docker pull tingcode/micro-nexus:latest
          docker save tingcode/micro-nexus:latest | gzip -1 > micro-nexus-image.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: micro-nexus-image.tar.gz
          target: /tmp
          timeout: 30m
          command_timeout: 30m

      - name: Deploy micro-nexus container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 30m
          command_timeout: 30m
          script: |
            gunzip -c /tmp/micro-nexus-image.tar.gz | docker load
            rm -f /tmp/micro-nexus-image.tar.gz
            docker stop micro-nexus || true
            docker rm micro-nexus || true
            docker run -d -p 8086:8086 --name micro-nexus --restart unless-stopped tingcode/micro-nexus:latest
